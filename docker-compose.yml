services:
  # 1. Database Service (MongoDB)
  mongodb:
    # Retained for separately authorized legacy data reconciliation only.
    profiles: ["legacy-mongo"]
    image: mongo:latest
    container_name: wavehouse_mongodb
    ports:
      - "27017:27017"
    volumes:
      - ./mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wavehouse_network

  # 2. Node.js Backend API Service
  backend:
    build: ./backend
    container_name: wavehouse_backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env.local
    environment:
      - NODE_ENV=development
      - PORT=5001
      - HOST=0.0.0.0
      - AIVEN_CA_PATH=/run/certs/aiven-ca.pem
    volumes:
      - ./ca.pem:/run/certs/aiven-ca.pem:ro
    networks:
      - wavehouse_network

  # 3. Python AI Service
  ai_service:
    build: ./ai-service
    container_name: wavehouse_ai_service
    ports:
      - "8000:8000"
    networks:
      - wavehouse_network

  web:
    build: ./web
    ports:
      - "3000:80"
    networks:
      - wavehouse_network

networks:
  wavehouse_network:
    driver: bridge
